name: Android Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install emulator image
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "emulator" "system-images;android-35;google_apis;x86_64"
      - name: Build Android deliverables
        run: gradle :apps:android:assembleCompanyTestDebug :apps:android:assembleProductionRelease :apps:android:bundleProductionRelease
      - name: Runtime smoke test
        shell: bash
        run: |
          echo no | avdmanager create avd -n movecrew-ci -k "system-images;android-35;google_apis;x86_64" --force
          nohup emulator -avd movecrew-ci -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect >/tmp/emulator.log 2>&1 &
          adb wait-for-device
          timeout 240 bash -c 'until [ "$(adb shell getprop sys.boot_completed | tr -d "\r")" = "1" ]; do sleep 2; done'
          APK=$(find apps/android/build/outputs/apk/companyTest/debug -name '*.apk' | head -n 1)
          test -f "$APK"
          adb install -r "$APK"
          adb logcat -c
          adb shell am start -W -n com.movecrew.test.debug/com.movecrew.android.TestCompanyActivity
          sleep 8
          PID=$(adb shell pidof com.movecrew.test.debug | tr -d '\r')
          test -n "$PID" || { adb logcat -d '*:E'; exit 1; }
          adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity' | grep -q 'com.movecrew.test.debug' || { adb logcat -d '*:E'; exit 1; }
          echo "MoveCrew runtime smoke test passed with PID $PID"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: movecrew-android
          path: |
            apps/android/build/outputs/apk/**/*.apk
            apps/android/build/outputs/bundle/**/*.aab
