name: Android Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "emulator" "system-images;android-35;google_apis;x86_64"
      - name: Build Android deliverables
        run: gradle :apps:android:assembleCompanyTestDebug :apps:android:assembleProductionRelease :apps:android:bundleProductionRelease
      - name: Runtime smoke test
        shell: bash
        run: |
          AVDMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager"
          if [ ! -x "$AVDMANAGER" ]; then
            AVDMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name avdmanager | head -n 1)"
          fi
          EMULATOR="$ANDROID_HOME/emulator/emulator"
          ADB="$ANDROID_HOME/platform-tools/adb"
          test -x "$AVDMANAGER"
          test -x "$EMULATOR"
          test -x "$ADB"

          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm || true
          fi

          echo no | "$AVDMANAGER" create avd -n movecrew-ci -k "system-images;android-35;google_apis;x86_64" --force
          nohup "$EMULATOR" -avd movecrew-ci -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect >/tmp/emulator.log 2>&1 &
          "$ADB" wait-for-device
          timeout 240 bash -c 'until [ "$("$ANDROID_HOME/platform-tools/adb" shell getprop sys.boot_completed | tr -d "\r")" = "1" ]; do sleep 2; done'

          APK=$(find apps/android/build/outputs/apk/companyTest/debug -name '*.apk' | head -n 1)
          test -f "$APK"
          "$ADB" install -r "$APK"
          "$ADB" logcat -c
          "$ADB" shell am start -W -n com.movecrew.test.debug/com.movecrew.android.TestCompanyActivity
          sleep 8

          PID=$("$ADB" shell pidof com.movecrew.test.debug | tr -d '\r')
          if [ -z "$PID" ]; then
            echo 'MoveCrew process died after launch.'
            cat /tmp/emulator.log || true
            "$ADB" logcat -d '*:E' || true
            exit 1
          fi

          RESUMED=$("$ADB" shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity' | grep 'com.movecrew.test.debug' || true)
          if [ -z "$RESUMED" ]; then
            echo 'MoveCrew is not the resumed foreground activity.'
            "$ADB" shell dumpsys activity activities | tail -n 200 || true
            "$ADB" logcat -d '*:E' || true
            exit 1
          fi

          echo "MoveCrew runtime smoke test passed with PID $PID"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: movecrew-android
          path: |
            apps/android/build/outputs/apk/**/*.apk
            apps/android/build/outputs/bundle/**/*.aab
